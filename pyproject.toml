[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodput"
version = "0.1.0"
description = "Distributed training fault-injection and checkpoint goodput simulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cletus Abumah" }]
dependencies = [
  "pydantic-settings>=2.0",
  "pydantic>=2.0",
  "torch>=2.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
viz = [
  "matplotlib>=3.8",
]

[project.scripts]
goodput-run = "goodput.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
