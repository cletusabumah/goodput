# Baseline Phase 1 experiment — naive ckpt, no fault (ticket 1.8).
# Run: goodput-run --config experiments/baseline.yaml
name: baseline-naive
mode: train
seed: 42
num_workers: 2
steps: 20
batch_size: 8
input_size: 16
hidden_size: 32
learning_rate: 0.001
ckpt_interval: 5
ckpt_mode: naive
ckpt_dir: artifacts/checkpoints/baseline-naive
fault_mode: none
device: cpu
artifacts_dir: artifacts
metrics_provider: json_file
