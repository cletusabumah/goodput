name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff (syntax / undefined names)
        run: ruff check src tests

      - name: Run pytest
        env:
          GOODPUT_CI_MODE: "1"
          GOODPUT_CHECKPOINT_PROVIDER: mock
          GOODPUT_FAULT_PROVIDER: mock
          GOODPUT_DEVICE: cpu
        run: pytest -q
